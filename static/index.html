<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hujjat Tarjimon</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --secondary: #0d9488;
    --secondary-dark: #0f766e;
    --accent: #f59e0b;
    --accent-dark: #d97706;
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-light: #64748b;
    --success: #0d9488;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container { width: 100%; max-width: 480px; }
  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 24px;
    color: var(--text);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(30, 41, 59, 0.06);
  }
  .drop-zone {
    border: 2px dashed var(--primary);
    border-radius: 14px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    background: linear-gradient(180deg, #eef2ff 0%, #ffffff 100%);
  }
  .drop-zone:active { transform: scale(0.98); }
  .drop-zone.dragover {
    border-color: var(--secondary);
    background: #ecfdf9;
  }
  .drop-zone p { margin: 8px 0 0; color: var(--text-light); font-size: 14px; }
  .drop-zone .icon { font-size: 40px; }
  #fileInput { display: none; }
  .file-chosen {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #eef2ff;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    box-shadow: inset 0 1px 3px rgba(79, 70, 229, 0.15);
  }
  .file-chosen button {
    background: var(--error);
    color: white;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(220, 38, 38, 0.4);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin: 16px 0 6px;
  }
  select {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: white;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
  }

  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: linear-gradient(180deg, #6366f1 0%, var(--primary) 100%);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--primary-dark), 0 6px 12px rgba(79, 70, 229, 0.35);
    transform: translateY(0);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button.primary:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--primary-dark), 0 2px 6px rgba(79, 70, 229, 0.3);
  }
  button.primary:disabled {
    background: #cbd5e1;
    box-shadow: 0 4px 0 #94a3b8;
    cursor: not-allowed;
  }

  .progress-wrap { display: none; }
  .progress-wrap.active { display: block; }
  .progress-bar-bg {
    width: 100%;
    height: 12px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 8px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-light);
  }
  .status-msg {
    text-align: center;
    font-size: 14px;
    margin-top: 12px;
    padding: 10px;
    border-radius: 10px;
  }
  .status-msg.error { background: #fef2f2; color: var(--error); }
  .status-msg.success { background: #f0fdfa; color: var(--success); }

  .download-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    background: linear-gradient(180deg, #14b8a6 0%, var(--secondary) 100%);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--secondary-dark), 0 6px 12px rgba(13, 148, 136, 0.35);
    transform: translateY(0);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .download-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--secondary-dark), 0 2px 6px rgba(13, 148, 136, 0.3);
  }
  .download-btn.active { display: block; }

  .restart-btn {
    display: none;
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: linear-gradient(180deg, #fbbf24 0%, var(--accent) 100%);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--accent-dark), 0 5px 10px rgba(245, 158, 11, 0.3);
    transform: translateY(0);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .restart-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--accent-dark), 0 1px 4px rgba(245, 158, 11, 0.3);
  }
  .restart-btn.active { display: block; }
</style>

<div class="container">
  <h1 id="pageTitle">📄 Hujjat Tarjimon</h1>

  <div class="card" id="uploadCard">
    <div class="drop-zone" id="dropZone">
      <div class="icon">📁</div>
      <p id="dropZoneText">PDF yoki DOCX faylni shu yerga tashlang<br>yoki bosib tanlang</p>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx">
    <div class="file-chosen" id="fileChosen" style="display:none;">
      <span id="fileName"></span>
      <button id="clearFile">✕</button>
    </div>

    <label for="langSelect" id="langLabel">Tarjima tili</label>
    <select id="langSelect">
      <option value="">...</option>
    </select>

    <button class="primary" id="translateBtn" disabled>Tarjima qilish</button>
  </div>

  <div class="card progress-wrap" id="progressCard">
    <div class="progress-label">
      <span id="progressStage">...</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div id="statusMsg"></div>
    <a class="download-btn" id="downloadBtn">⬇ <span id="downloadBtnText">Yuklab olish</span></a>
    <button class="restart-btn" id="restartBtn">Yangi fayl</button>
  </div>
</div>

    stage_pending: "En file d'attente...", stage_detecting_language: "Détection de la langue du fichier...",
    stage_converting_to_docx: "Conversion du fichier en DOCX...", stage_ocr_scanned_pages: "Lecture des pages numérisées (OCR)...",
    stage_translating: "Traduction du texte...", stage_converting_to_pdf: "Mise en forme du fichier...",
  },
  es: {
    title: "📄 Traductor de documentos", dropZone: "Suelta un archivo PDF o DOCX aquí<br>o haz clic para seleccionar",
    invalidFile: "Solo se aceptan archivos PDF o DOCX.", langLabel: "Idioma de traducción",
    translateBtn: "Traducir", uploading: "Subiendo...", uploadError: "Error de carga: ",
    connError: "Conexión perdida. Actualiza la página e inténtalo de nuevo.",
    success: "✅ Traducción completada con éxito.", done: "¡Listo!", failPrefix: "❌ Error: ",

    stage_translating: "Traduciendo texto...", stage_converting_to_pdf: "Dando formato al archivo...",
  },
  zh: {
    title: "📄 文档翻译器", dropZone: "将 PDF 或 DOCX 文件拖到此处<br>或点击选择",
    invalidFile: "仅接受 PDF 或 DOCX 文件。", langLabel: "翻译语言",
    translateBtn: "翻译", uploading: "上传中...", uploadError: "上传错误：",
    connError: "连接已断开。请刷新页面重试。",
    success: "✅ 翻译已成功完成。", done: "完成！", failPrefix: "❌ 错误：",
    failDefault: "翻译失败。", downloadBtn: "下载翻译后的文件",
    restartBtn: "翻译另一个文件", langsFailed: "无法加载语言列表",
    stage_pending: "排队中...", stage_detecting_language: "正在检测文件语言...",
    stage_converting_to_docx: "正在转换为 DOCX...", stage_ocr_scanned_pages: "正在读取扫描页面 (OCR)...",
    stage_translating: "正在翻译文本...", stage_converting_to_pdf: "正在格式化文件...",
  },
};

function t(key) {
  const lang = langSelect.value || "uz";
  return (STRINGS[lang] && STRINGS[lang][key]) || (STRINGS.uz[key]) || key;
}

function applyUiLanguage() {
  const lang = langSelect.value || "uz";
  const isRtl = lang === "ar" || lang === "fa";
  document.documentElement.lang = lang;
  document.documentElement.dir = isRtl ? "rtl" : "ltr";
  document.getElementById("pageTitle").textContent = t("title");
  document.getElementById("dropZoneText").innerHTML = t("dropZone");
  document.getElementById("langLabel").textContent = t("langLabel");
  document.getElementById("translateBtn").textContent = t("translateBtn");
  document.getElementById("downloadBtnText").textContent = t("downloadBtn");
  document.getElementById("restartBtn").textContent = t("restartBtn");
  document.getElementById("progressStage").textContent = t("stage_pending");
}

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileChosen = document.getElementById("fileChosen");
const fileName = document.getElementById("fileName");
const clearFile = document.getElementById("clearFile");
const langSelect = document.getElementById("langSelect");
const translateBtn = document.getElementById("translateBtn");
const uploadCard = document.getElementById("uploadCard");
const progressCard = document.getElementById("progressCard");
const progressFill = document.getElementById("progressFill");
const progressStage = document.getElementById("progressStage");
const progressPercent = document.getElementById("progressPercent");
const statusMsg = document.getElementById("statusMsg");
const downloadBtn = document.getElementById("downloadBtn");
const restartBtn = document.getElementById("restartBtn");

let selectedFile = null;
let currentEventSource = null;

async function loadLanguages() {
  try {
    const res = await fetch(`${API}/languages`);
    if (!res.ok) throw new Error("Tillarni olishda xatolik");
    const langs = await res.json();
    langSelect.innerHTML = "";
    langs.forEach(l => {
      const code = l.code;
      const opt = document.createElement("option");
      opt.value = code;
      opt.textContent = l.name_native || l.name_en || code;
      langSelect.appendChild(opt);
    });
    applyUiLanguage();
  } catch (e) {
    langSelect.innerHTML = `<option value="">${t("langsFailed")}</option>`;
    console.error(e);
  }
}
loadLanguages();

langSelect.addEventListener("change", applyUiLanguage);

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length) setFile(e.target.files[0]);
});
clearFile.addEventListener("click", (e) => {
  e.stopPropagation();
  selectedFile = null;
  fileInput.value = "";
  fileChosen.style.display = "none";
  dropZone.style.display = "block";
  translateBtn.disabled = true;
});

function setFile(file) {
  const validExt = /\.(pdf|docx)$/i.test(file.name);
  if (!validExt) {
    alert(t("invalidFile"));
    return;
  }
  selectedFile = file;
  fileName.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
  fileChosen.style.display = "flex";
  dropZone.style.display = "none";
  translateBtn.disabled = false;
}

translateBtn.addEventListener("click", async () => {
  if (!selectedFile) return;
  translateBtn.disabled = true;
  translateBtn.textContent = t("uploading");

  const formData = new FormData();
  formData.append("file", selectedFile);
  formData.append("target_lang", langSelect.value);

  try {
    const res = await fetch(`${API}/translate`, {
      method: "POST",
      body: formData,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Error: ${res.status}`);
    }
    const data = await res.json();
    startProgressTracking(data.task_id);
  } catch (e) {
    alert(t("uploadError") + e.message);
    translateBtn.disabled = false;
    translateBtn.textContent = t("translateBtn");
  }
});

function stageLabel(status) {
  const key = "stage_" + status;
  const lang = langSelect.value || "uz";
  if (STRINGS[lang] && STRINGS[lang][key]) return STRINGS[lang][key];
  if (STRINGS.uz[key]) return STRINGS.uz[key];
  return status;
}

function startProgressTracking(taskId) {
  uploadCard.style.display = "none";
  progressCard.classList.add("active");
  statusMsg.textContent = "";
  statusMsg.className = "status-msg";
  downloadBtn.classList.remove("active");
  restartBtn.classList.remove("active");
  progressStage.textContent = t("stage_pending");
  progressFill.style.width = "0%";
  progressPercent.textContent = "0%";

  currentEventSource = new EventSource(`${API}/progress/${taskId}`);

  currentEventSource.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      updateProgress(data, taskId);
    } catch (e) {
      console.error("Progress parse error:", e);
    }
  };

  currentEventSource.onerror = () => {
    currentEventSource.close();
    statusMsg.textContent = t("connError");
    statusMsg.className = "status-msg error";
    restartBtn.classList.add("active");
  };
}

function updateProgress(data, taskId) {
  const percent = Math.max(0, Math.min(100, Math.round(data.progress || 0)));
  progressFill.style.width = `${percent}%`;
  progressPercent.textContent = `${percent}%`;

  if (data.status === "completed") {
    currentEventSource.close();
    progressFill.style.width = "100%";
    progressPercent.textContent = "100%";
    progressStage.textContent = t("done");
    statusMsg.textContent = t("success");
    statusMsg.className = "status-msg success";
    downloadBtn.href = `${API}/download/${taskId}`;
    downloadBtn.classList.add("active");
    restartBtn.classList.add("active");
  } else if (data.status === "failed") {
    currentEventSource.close();
    statusMsg.textContent = t("failPrefix") + (data.error || t("failDefault"));
    statusMsg.className = "status-msg error";
    restartBtn.classList.add("active");
  } else {
    progressStage.textContent = stageLabel(data.status);
  }
}

restartBtn.addEventListener("click", () => {
  if (currentEventSource) currentEventSource.close();
  selectedFile = null;
  fileInput.value = "";
  fileChosen.style.display = "none";
  dropZone.style.display = "block";
  translateBtn.disabled = true;
  translateBtn.textContent = t("translateBtn");
  progressCard.classList.remove("active");
  uploadCard.style.display = "block";
});
</script>
</body>
</html>
