<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hujjat Tarjimon</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-light: #64748b;
    --success: #16a34a;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container { width: 100%; max-width: 480px; }
  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 24px;
    color: var(--text);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone.dragover {
    border-color: var(--primary);
    background: #eef2ff;
  }
  .drop-zone p { margin: 8px 0 0; color: var(--text-light); font-size: 14px; }
  .drop-zone .icon { font-size: 40px; }
  #fileInput { display: none; }
  .file-chosen {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #eef2ff;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
  }
  .file-chosen button {
    background: none;
    border: none;
    color: var(--error);
    font-size: 18px;
    cursor: pointer;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin: 16px 0 6px;
  }
  select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: white;
  }
  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button.primary:hover { background: var(--primary-dark); }
  button.primary:disabled { background: #cbd5e1; cursor: not-allowed; }

  .progress-wrap { display: none; }
  .progress-wrap.active { display: block; }
  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-light);
  }
  .status-msg {
    text-align: center;
    font-size: 14px;
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
  }
  .status-msg.error { background: #fef2f2; color: var(--error); }
  .status-msg.success { background: #f0fdf4; color: var(--success); }
  .download-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    background: var(--success);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
  }
  .download-btn.active { display: block; }
  .restart-btn {
    display: none;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: transparent;
    color: var(--text-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .restart-btn.active { display: block; }
</style>
</head>
<body>
<div class="container">
  <h1>📄 Hujjat Tarjimon</h1>

  <div class="card" id="uploadCard">
    <div class="drop-zone" id="dropZone">
      <div class="icon">📁</div>
      <p>PDF yoki DOCX faylni shu yerga tashlang<br>yoki bosib tanlang</p>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx">
    <div class="file-chosen" id="fileChosen" style="display:none;">
      <span id="fileName"></span>
      <button id="clearFile">✕</button>
    </div>

    <label for="langSelect">Tarjima tili</label>
    <select id="langSelect">
      <option value="">Yuklanmoqda...</option>
    </select>

    <button class="primary" id="translateBtn" disabled>Tarjima qilish</button>
  </div>

  <div class="card progress-wrap" id="progressCard">
    <div class="progress-label">
      <span id="progressStage">Boshlanmoqda...</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div id="statusMsg"></div>
    <a class="download-btn" id="downloadBtn">⬇ Tarjima qilingan faylni yuklab olish</a>
    <button class="restart-btn" id="restartBtn">Yangi fayl tarjima qilish</button>
  </div>
</div>

<script>
const API_BASE = "";
const API = API_BASE + "/api";

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileChosen = document.getElementById("fileChosen");
const fileName = document.getElementById("fileName");
const clearFile = document.getElementById("clearFile");
const langSelect = document.getElementById("langSelect");
const translateBtn = document.getElementById("translateBtn");
const uploadCard = document.getElementById("uploadCard");
const progressCard = document.getElementById("progressCard");
const progressFill = document.getElementById("progressFill");
const progressStage = document.getElementById("progressStage");
const progressPercent = document.getElementById("progressPercent");
const statusMsg = document.getElementById("statusMsg");
const downloadBtn = document.getElementById("downloadBtn");
const restartBtn = document.getElementById("restartBtn");

let selectedFile = null;
let currentEventSource = null;

async function loadLanguages() {
  try {
    const res = await fetch(`${API}/languages`);
    if (!res.ok) throw new Error("Tillarni olishda xatolik");
    const langs = await res.json();
    langSelect.innerHTML = "";
    langs.forEach(l => {
      const opt = document.createElement("option");
      opt.value = l.code || l.lang || l.value;
      opt.textContent = l.name || l.label || opt.value;
      langSelect.appendChild(opt);
    });
  } catch (e) {
    langSelect.innerHTML = '<option value="">Tillarni yuklab bo\'lmadi</option>';
    console.error(e);
  }
}
loadLanguages();

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length) setFile(e.target.files[0]);
});
clearFile.addEventListener("click", (e) => {
  e.stopPropagation();
  selectedFile = null;
  fileInput.value = "";
  fileChosen.style.display = "none";
  dropZone.style.display = "block";
  translateBtn.disabled = true;
});

function setFile(file) {
  const validExt = /\.(pdf|docx)$/i.test(file.name);
  if (!validExt) {
    alert("Faqat PDF yoki DOCX fayllar qabul qilinadi.");
    return;
  }
  selectedFile = file;
  fileName.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
  fileChosen.style.display = "flex";
  dropZone.style.display = "none";
  translateBtn.disabled = false;
}

translateBtn.addEventListener("click", async () => {
  if (!selectedFile) return;
  translateBtn.disabled = true;
  translateBtn.textContent = "Yuklanmoqda...";

  const formData = new FormData();
  formData.append("file", selectedFile);
  formData.append("target_lang", langSelect.value);

  try {
    const res = await fetch(`${API}/translate`, {
      method: "POST",
      body: formData,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Xatolik: ${res.status}`);
    }
    const data = await res.json();
    startProgressTracking(data.task_id);
  } catch (e) {
    alert("Yuklashda xatolik: " + e.message);
    translateBtn.disabled = false;
    translateBtn.textContent = "Tarjima qilish";
  }
});

function startProgressTracking(taskId) {
  uploadCard.style.display = "none";
  progressCard.classList.add("active");
  statusMsg.textContent = "";
  statusMsg.className = "status-msg";
  downloadBtn.classList.remove("active");
  restartBtn.classList.remove("active");

  currentEventSource = new EventSource(`${API}/progress/${taskId}`);

  currentEventSource.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      updateProgress(data, taskId);
    } catch (e) {
      console.error("Progress parse xatosi:", e);
    }
  };

  currentEventSource.onerror = () => {
    currentEventSource.close();
    statusMsg.textContent = "Ulanishda uzilish yuz berdi. Sahifani yangilab qayta urinib ko'ring.";
    statusMsg.className = "status-msg error";
    restartBtn.classList.add("active");
  };
}

function updateProgress(data, taskId) {
  const percent = Math.round((data.progress || 0) * (data.progress <= 1 ? 100 : 1));
  progressFill.style.width = `${Math.min(percent, 100)}%`;
  progressPercent.textContent = `${Math.min(percent, 100)}%`;
  progressStage.textContent = data.stage || data.message || "Ishlanmoqda...";

  if (data.status === "completed") {
    currentEventSource.close();
    progressFill.style.width = "100%";
    progressPercent.textContent = "100%";
    progressStage.textContent = "Tayyor!";
    statusMsg.textContent = "✅ Tarjima muvaffaqiyatli yakunlandi.";
    statusMsg.className = "status-msg success";
    downloadBtn.href = `${API}/download/${taskId}`;
    downloadBtn.classList.add("active");
    restartBtn.classList.add("active");
  } else if (data.status === "failed") {
    currentEventSource.close();
    statusMsg.textContent = "❌ Xatolik: " + (data.error || data.message || "Tarjima amalga oshmadi.");
    statusMsg.className = "status-msg error";
    restartBtn.classList.add("active");
  }
}

restartBtn.addEventListener("click", () => {
  if (currentEventSource) currentEventSource.close();
  selectedFile = null;
  fileInput.value = "";
  fileChosen.style.display = "none";
  dropZone.style.display = "block";
  translateBtn.disabled = true;
  translateBtn.textContent = "Tarjima qilish";
  progressCard.classList.remove("active");
  uploadCard.style.display = "block";
});
</script>
</body>
</html>
